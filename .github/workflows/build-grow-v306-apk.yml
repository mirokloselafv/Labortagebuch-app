name: Build Grow Tagebuch v306 APK

on:
  push:
    branches: [ grow-v306-build ]
    paths:
      - 'app/**'
      - '.github/v306/**'
      - 'scripts/**'
      - '.github/workflows/build-grow-v306-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct clean v306 transformer
        shell: bash
        run: |
          set -euo pipefail
          echo '27ebfc22aaa58d15eaada768d4a78eb4c48898bcd8a06aa8a2ed8a243fcfb756  .github/v306/apply_v306.py.gz.b64' | sha256sum -c -
          tr -d '\n\r' < .github/v306/apply_v306.py.gz.b64 | base64 --decode | gzip -dc > /tmp/apply_v306.py
          echo '3dd9305f89fb993a7fda7c8c87ab15638b4d740fd4e01cedc5e4ab76708bd1ac  /tmp/apply_v306.py' | sha256sum -c -

      - name: Apply v306 and run HTML preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/apply_v306.py
          echo '1a4116cf700ba7ce3ad9b4f2dbd4b279b568127140b4b28dfdc64b2f6e47c56b  app/src/main/assets/index.html' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, collections, tempfile
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          if not s.rstrip().lower().endswith('</html>'):
              raise SystemExit('content after </html>')
          ids=re.findall(r'\bid=["\']([^"\']+)["\']',s)
          dup=[k for k,v in collections.Counter(ids).items() if v>1]
          if dup:
              raise SystemExit('duplicate IDs: '+', '.join(dup[:20]))
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script\s*>',s,re.I|re.S)
          for i,js in enumerate(scripts):
              f=Path('/tmp')/f'v306_inline_{i}.js'
              f.write_text(js,encoding='utf-8')
              subprocess.run(['node','--check',str(f)],check=True)
          required=['calendarBody','calendarToggle','action2Routinecheck','a2SliderPanel','a2RoutineSensorFill','a2RoutineWeightFeelSlider','h5179RangeTabs','h5179CustomFrom','h5179CustomTo']
          missing=[x for x in required if f'id="{x}"' not in s]
          if missing:
              raise SystemExit('missing nodes: '+', '.join(missing))
          print(f'preflight OK: {len(scripts)} inline scripts, {len(ids)} IDs')
          PY

      - name: Prepare side-by-side v306 test package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text()
          s=s.replace("applicationId 'de.harryjane.growtagebuch'", "applicationId 'de.harryjane.growtagebuch.v306test'")
          s=s.replace('versionCode 305','versionCode 306')
          s=s.replace("versionName '3.03-stable-h5179-statistics'", "versionName '306-routine-sensor-filter'")
          p.write_text(s)
          m=Path('app/src/main/AndroidManifest.xml')
          t=m.read_text()
          t=t.replace('android:label="Grow-Tagebuch"','android:label="Grow-Tagebuch v306 Test"')
          m.write_text(t)
          PY

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Grow-Tagebuch-v306-Test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Grow-Tagebuch-v306-Test-APK
          path: Grow-Tagebuch-v306-Test.apk
          if-no-files-found: error
          retention-days: 30
