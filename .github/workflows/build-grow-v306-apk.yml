name: Build Grow Tagebuch v306 APK

on:
  push:
    branches: [ grow-v306-build ]
    paths:
      - 'app/**'
      - '.github/v306/**'
      - '.github/workflows/build-grow-v306-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct and verify v306 patch
        shell: bash
        run: |
          set -euo pipefail
          echo '6fac530737e23446559018c63d30598814cdb4a4a7def7063f4bbf9426f153d9  .github/v306/v306-patch.js.gz.b64' | sha256sum -c -
          tr -d '\n\r' < .github/v306/v306-patch.js.gz.b64 | base64 --decode | gzip -dc > app/src/main/assets/v306-patch.js
          echo 'abd40c001b07491e281bd28b2a5e145fa3daaec6a697b45f53f2ac6d683f1ccf  app/src/main/assets/v306-patch.js' | sha256sum -c -
          node --check app/src/main/assets/v306-patch.js

      - name: Inject v306 patch and preflight HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="v306-patch.js"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('index.html has no </body>')
              s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          if not s.rstrip().lower().endswith('</html>'):
              raise SystemExit('content after </html>')
          if s.count('id="gardenMain"') > 1:
              raise SystemExit('duplicate gardenMain')
          PY

      - name: Prepare v306 side-by-side test package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text()
          s=s.replace("applicationId 'de.harryjane.growtagebuch'", "applicationId 'de.harryjane.growtagebuch.v306test'")
          s=s.replace('versionCode 305','versionCode 306')
          s=s.replace("versionName '3.03-stable-h5179-statistics'", "versionName '306-routine-sensor-filter'")
          p.write_text(s)
          m=Path('app/src/main/AndroidManifest.xml')
          t=m.read_text()
          t=t.replace('android:label="Grow-Tagebuch"','android:label="Grow-Tagebuch v306 Test"')
          m.write_text(t)
          PY

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Grow-Tagebuch-v306-Test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Grow-Tagebuch-v306-Test-APK
          path: Grow-Tagebuch-v306-Test.apk
          if-no-files-found: error
          retention-days: 30
