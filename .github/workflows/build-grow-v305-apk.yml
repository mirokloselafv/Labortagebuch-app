name: Build Grow Tagebuch v305 APK

on:
  push:
    branches: [ grow-v305-build ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-grow-v305-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Grow-Tagebuch-v305.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Grow-Tagebuch-v305-APK
          path: Grow-Tagebuch-v305.apk
          if-no-files-found: error
          retention-days: 30
