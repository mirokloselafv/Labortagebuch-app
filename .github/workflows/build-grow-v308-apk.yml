name: Build Grow Tagebuch v308 APK

on:
  push:
    branches: [ grow-v308-build ]
    paths:
      - 'app/**'
      - '.github/v306/**'
      - '.github/v307/**'
      - '.github/v308/**'
      - '.github/workflows/build-grow-v308-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct transformers and lighting databases
        shell: bash
        run: |
          set -euo pipefail
          echo '27ebfc22aaa58d15eaada768d4a78eb4c48898bcd8a06aa8a2ed8a243fcfb756  .github/v306/apply_v306.py.gz.b64' | sha256sum -c -
          tr -d '\n\r' < .github/v306/apply_v306.py.gz.b64 | base64 --decode | gzip -dc > /tmp/apply_v306.py
          echo '3dd9305f89fb993a7fda7c8c87ab15638b4d740fd4e01cedc5e4ab76708bd1ac  /tmp/apply_v306.py' | sha256sum -c -

          tr -d '\n\r' < .github/v307/apply_v307.py.gz.b64 | base64 --decode | gzip -dc > /tmp/apply_v307.py
          echo '8459cd5d4dca9113eddbff6ec5412e3ace2418201843d71140bdac64d66d71c3  /tmp/apply_v307.py' | sha256sum -c -

          cat .github/v307/db_chunk_*.b64 | tr -d '\n\r' | base64 --decode | gzip -dc > /tmp/lighting-db-v2.js
          echo '02cb3baa24c7a619a7a2b392dd1809fe007c4412c6f89d14aa8ac21f03229f0b  /tmp/lighting-db-v2.js' | sha256sum -c -

          tr -d '\n\r' < .github/v308/apply_v308.py.gz.b64 | base64 --decode > /tmp/apply_v308.py.gz
          echo 'ed6203214cddde515f644267ee673fbc8c5ffcb6f4733069cf9fd0d76c4e3829  /tmp/apply_v308.py' > /tmp/v308-transform.sha
          gzip -dc /tmp/apply_v308.py.gz > /tmp/apply_v308.py
          sha256sum -c /tmp/v308-transform.sha
          python3 -m py_compile /tmp/apply_v308.py

          cat .github/v308/db_chunk_*.b64 | tr -d '\n\r' | base64 --decode > /tmp/lighting-db-v3.js.gz
          echo '4000b717e3662c09f6cc5cd6ff2edb8152afd6d2b2d3fb96298be4f0edec2383  /tmp/lighting-db-v3.js.gz' | sha256sum -c -
          gzip -dc /tmp/lighting-db-v3.js.gz > /tmp/lighting-db-v3.js
          echo '58a1c2e93bbe9acda24e8d9bfc1a549cd3d52954cf95b37482c069842444090f  /tmp/lighting-db-v3.js' | sha256sum -c -

      - name: Apply v306 v307 and v308 integrations
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/apply_v306.py
          echo '1a4116cf700ba7ce3ad9b4f2dbd4b279b568127140b4b28dfdc64b2f6e47c56b  app/src/main/assets/index.html' | sha256sum -c -
          python3 /tmp/apply_v307.py app/src/main/assets/index.html app/src/main/assets/index.html
          cp /tmp/lighting-db-v2.js app/src/main/assets/lighting-db-v2.js
          echo '9e6e45647ecfac643463b7b15b14c36a6e5da6797e348f91e03645ef36f1fad5  app/src/main/assets/index.html' | sha256sum -c -

          python3 /tmp/apply_v308.py app/src/main/assets/index.html app/src/main/assets/index.html
          cp /tmp/lighting-db-v3.js app/src/main/assets/lighting-db-v3.js
          rm -f app/src/main/assets/lighting-db-v2.js
          echo 'ed77476c1cba727fb2377523e532ff2680078ed518e885fa89726f184e0b92c1  app/src/main/assets/index.html' | sha256sum -c -
          echo '58a1c2e93bbe9acda24e8d9bfc1a549cd3d52954cf95b37482c069842444090f  app/src/main/assets/lighting-db-v3.js' | sha256sum -c -

      - name: HTML and lighting v3 database preflight
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/lighting-db-v3.js
          node - <<'JS'
          const fs=require('fs'),vm=require('vm');
          const ctx={window:{}}; vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('app/src/main/assets/lighting-db-v3.js','utf8'),ctx);
          const rows=ctx.window.LIGHTING_PRODUCTS_V3;
          if(!Array.isArray(rows)||rows.length!==347) throw new Error('Expected 347 lighting records');
          if(new Set(rows.map(x=>x.id)).size!==347) throw new Error('Lighting IDs are not unique');
          const makers=new Set(rows.map(x=>x.maker));
          if(makers.size!==20) throw new Error('Expected 20 manufacturers, got '+makers.size);
          const san=rows.filter(x=>x.maker==='SANlight');
          if(san.length!==55) throw new Error('Expected 55 SANlight records, got '+san.length);
          for(const x of rows){ for(const k of ['name','maker','lightType','notes']) if(!(k in x)) throw new Error(`Missing ${k} on ${x.id}`); }
          if(typeof ctx.window.mergeLightingProductsV3!=='function') throw new Error('mergeLightingProductsV3 missing');
          console.log('lighting DB v3 OK:',rows.length,'records,',makers.size,'manufacturers,',san.length,'SANlight');
          JS
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re, subprocess, collections
          p=Path('app/src/main/assets/index.html'); s=p.read_text(encoding='utf-8')
          if not s.rstrip().lower().endswith('</html>'): raise SystemExit('content after </html>')
          class P(HTMLParser):
              def __init__(self): super().__init__(convert_charrefs=False); self.ids=[]
              def handle_starttag(self,tag,attrs):
                  for k,v in attrs:
                      if k=='id' and v is not None: self.ids.append(v)
              def handle_startendtag(self,tag,attrs): self.handle_starttag(tag,attrs)
          pz=P(); pz.feed(s)
          dup=[k for k,v in collections.Counter(pz.ids).items() if v>1]
          if dup: raise SystemExit('duplicate static DOM IDs: '+', '.join(dup[:20]))
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script\s*>',s,re.I|re.S)
          for i,js in enumerate(scripts):
              f=Path('/tmp')/f'v308_inline_{i}.js'; f.write_text(js,encoding='utf-8'); subprocess.run(['node','--check',str(f)],check=True)
          required=['calendarBody','calendarToggle','action2Routinecheck','a2SliderPanel','a2RoutineSensorFill','a2RoutineWeightFeelSlider','h5179RangeTabs','h5179CustomFrom','h5179CustomTo','materialEntries']
          miss=[x for x in required if x not in pz.ids]
          if miss: raise SystemExit('missing nodes: '+', '.join(miss))
          for marker in ['lighting-db-v3.js','mergeLightingProductsV3(before)','lightingGenerationViewV3','activeLightingGeneration','v308-lighting-db-v3-recovery','LIGHTING_MAKER_ORDER_V3']:
              if marker not in s: raise SystemExit('missing v308 marker: '+marker)
          if 'lighting-db-v2.js' in s: raise SystemExit('old lighting-db-v2.js reference still present')
          print(f'v308 preflight OK: {len(scripts)} inline scripts, {len(pz.ids)} static IDs')
          PY

      - name: Prepare side-by-side v308 test package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle'); s=p.read_text()
          s=s.replace("applicationId 'de.harryjane.growtagebuch'", "applicationId 'de.harryjane.growtagebuch.v308test'")
          s=re.sub(r'versionCode\s+\d+', 'versionCode 308', s, count=1)
          s=re.sub(r"versionName\s+'[^']+'", "versionName '308-lighting-db-v3-recovery'", s, count=1)
          p.write_text(s)
          m=Path('app/src/main/AndroidManifest.xml'); t=m.read_text()
          if 'android.permission.INTERNET' not in t:
              t=t.replace('<manifest ', '<manifest ', 1)
              pos=t.find('>')+1
              t=t[:pos]+'\n    <uses-permission android:name="android.permission.INTERNET" />'+t[pos:]
          t=t.replace('android:label="Grow-Tagebuch"','android:label="Grow-Tagebuch v308 Test"')
          m.write_text(t)
          PY
          grep -q "applicationId 'de.harryjane.growtagebuch.v308test'" app/build.gradle
          grep -q 'versionCode 308' app/build.gradle
          grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Grow-Tagebuch-v308-Beleuchtung-v3-Test.apk

      - name: Verify APK contents
        shell: bash
        run: |
          set -euo pipefail
          unzip -t Grow-Tagebuch-v308-Beleuchtung-v3-Test.apk >/dev/null
          unzip -p Grow-Tagebuch-v308-Beleuchtung-v3-Test.apk assets/index.html | grep -q 'v308-lighting-db-v3-recovery'
          unzip -p Grow-Tagebuch-v308-Beleuchtung-v3-Test.apk assets/lighting-db-v3.js > /tmp/apk-lighting-db-v3.js
          echo '58a1c2e93bbe9acda24e8d9bfc1a549cd3d52954cf95b37482c069842444090f  /tmp/apk-lighting-db-v3.js' | sha256sum -c -

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Grow-Tagebuch-v308-Beleuchtung-v3-Test-APK
          path: Grow-Tagebuch-v308-Beleuchtung-v3-Test.apk
          if-no-files-found: error
          retention-days: 30
