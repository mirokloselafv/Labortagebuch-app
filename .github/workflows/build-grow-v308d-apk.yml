name: Build Grow Tagebuch v308D APK and publish branch file

on:
  push:
    branches: [ grow-v308-build ]
    paths:
      - 'app/**'
      - '.github/v306/**'
      - '.github/v307/**'
      - '.github/v308/**'
      - '.github/workflows/build-grow-v308d-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grow-v308-build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct verified sources
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\n\r' < .github/v306/apply_v306.py.gz.b64 | base64 --decode | gzip -dc > /tmp/apply_v306.py
          echo '3dd9305f89fb993a7fda7c8c87ab15638b4d740fd4e01cedc5e4ab76708bd1ac  /tmp/apply_v306.py' | sha256sum -c -
          tr -d '\n\r' < .github/v307/apply_v307.py.gz.b64 | base64 --decode | gzip -dc > /tmp/apply_v307.py
          echo '8459cd5d4dca9113eddbff6ec5412e3ace2418201843d71140bdac64d66d71c3  /tmp/apply_v307.py' | sha256sum -c -
          cat .github/v307/db_chunk_*.b64 | tr -d '\n\r' | base64 --decode | gzip -dc > /tmp/lighting-db-v2.js
          echo '02cb3baa24c7a619a7a2b392dd1809fe007c4412c6f89d14aa8ac21f03229f0b  /tmp/lighting-db-v2.js' | sha256sum -c -
          cat .github/v308/apply_chunk_*.b64 | tr -d '\n\r' | base64 --decode > /tmp/apply_v308.py.gz
          gzip -dc /tmp/apply_v308.py.gz > /tmp/apply_v308.py
          echo 'ed6203214cddde515f644267ee673fbc8c5ffcb6f4733069cf9fd0d76c4e3829  /tmp/apply_v308.py' | sha256sum -c -
          python3 -m py_compile /tmp/apply_v308.py
          {
            cat .github/v308/db_chunk_000.b64
            cat .github/v308/db_chunk_001.b64
            cat .github/v308/db_chunk_002.b64
            cat .github/v308/db003_000.b64
            cat .github/v308/db003_001.b64
            cat .github/v308/db003_002.b64
            cat .github/v308/db003_003.b64
            cat .github/v308/db003_004.b64
            cat .github/v308/db003_005.b64
            cat .github/v308/db003_006_fix.b64
            cat .github/v308/db_chunk_004.b64
          } | tr -d '\n\r' | base64 --decode > /tmp/lighting-db-v3.js.gz
          echo '4000b717e3662c09f6cc5cd6ff2edb8152afd6d2b2d3fb96298be4f0edec2383  /tmp/lighting-db-v3.js.gz' | sha256sum -c -
          gzip -dc /tmp/lighting-db-v3.js.gz > /tmp/lighting-db-v3.js
          echo '58a1c2e93bbe9acda24e8d9bfc1a549cd3d52954cf95b37482c069842444090f  /tmp/lighting-db-v3.js' | sha256sum -c -

      - name: Apply v306 v307 v308
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/apply_v306.py
          echo '1a4116cf700ba7ce3ad9b4f2dbd4b279b568127140b4b28dfdc64b2f6e47c56b  app/src/main/assets/index.html' | sha256sum -c -
          python3 /tmp/apply_v307.py app/src/main/assets/index.html app/src/main/assets/index.html
          cp /tmp/lighting-db-v2.js app/src/main/assets/lighting-db-v2.js
          echo '9e6e45647ecfac643463b7b15b14c36a6e5da6797e348f91e03645ef36f1fad5  app/src/main/assets/index.html' | sha256sum -c -
          python3 /tmp/apply_v308.py app/src/main/assets/index.html app/src/main/assets/index.html
          cp /tmp/lighting-db-v3.js app/src/main/assets/lighting-db-v3.js
          rm -f app/src/main/assets/lighting-db-v2.js
          echo 'ed77476c1cba727fb2377523e532ff2680078ed518e885fa89726f184e0b92c1  app/src/main/assets/index.html' | sha256sum -c -
          echo '58a1c2e93bbe9acda24e8d9bfc1a549cd3d52954cf95b37482c069842444090f  app/src/main/assets/lighting-db-v3.js' | sha256sum -c -

      - name: Preflight full app and lighting v3
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/lighting-db-v3.js
          node - <<'JS'
          const fs=require('fs'),vm=require('vm'); const c={window:{}}; vm.createContext(c);
          vm.runInContext(fs.readFileSync('app/src/main/assets/lighting-db-v3.js','utf8'),c);
          const r=c.window.LIGHTING_PRODUCTS_V3;
          if(!Array.isArray(r)||r.length!==347) throw Error('347 records required');
          if(new Set(r.map(x=>x.id)).size!==347) throw Error('IDs not unique');
          if(new Set(r.map(x=>x.maker)).size!==20) throw Error('20 makers required');
          if(r.filter(x=>x.maker==='SANlight').length!==55) throw Error('55 SANlight required');
          for(const x of r) for(const k of ['name','maker','lightType','notes']) if(!(k in x)) throw Error('legacy field missing '+x.id+' '+k);
          if(typeof c.window.mergeLightingProductsV3!=='function') throw Error('merge function missing');
          console.log('Lighting DB v3 OK: 347 records, 20 makers, 55 SANlight');
          JS
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re,subprocess,collections
          s=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          if not s.rstrip().lower().endswith('</html>'): raise SystemExit('content after </html>')
          class P(HTMLParser):
            def __init__(self): super().__init__(convert_charrefs=False); self.ids=[]
            def handle_starttag(self,t,a): self.ids += [v for k,v in a if k=='id' and v]
            def handle_startendtag(self,t,a): self.handle_starttag(t,a)
          p=P(); p.feed(s)
          dup=[k for k,v in collections.Counter(p.ids).items() if v>1]
          if dup: raise SystemExit('duplicate static IDs: '+str(dup[:20]))
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script\s*>',s,re.I|re.S)
          for i,js in enumerate(scripts):
            f=Path('/tmp')/f'v308_{i}.js'; f.write_text(js,encoding='utf-8'); subprocess.run(['node','--check',str(f)],check=True)
          required=['calendarBody','calendarToggle','action2Routinecheck','a2SliderPanel','a2RoutineSensorFill','a2RoutineWeightFeelSlider','h5179RangeTabs','h5179CustomFrom','h5179CustomTo','materialEntries']
          miss=[x for x in required if x not in p.ids]
          if miss: raise SystemExit('missing DOM: '+str(miss))
          markers=['lighting-db-v3.js','mergeLightingProductsV3(before)','lightingGenerationViewV3','activeLightingGeneration','v308-lighting-db-v3-recovery','LIGHTING_MAKER_ORDER_V3']
          miss=[x for x in markers if x not in s]
          if miss: raise SystemExit('missing v308 markers: '+str(miss))
          if 'lighting-db-v2.js' in s: raise SystemExit('old v2 DB reference remains')
          print('HTML preflight OK:',len(scripts),'inline JS blocks,',len(p.ids),'IDs')
          PY

      - name: Prepare side-by-side Android test app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle'); s=p.read_text()
          s=s.replace("applicationId 'de.harryjane.growtagebuch'", "applicationId 'de.harryjane.growtagebuch.v308test'")
          s=re.sub(r'versionCode\s+\d+','versionCode 308',s,count=1)
          s=re.sub(r"versionName\s+'[^']+'","versionName '308-lighting-db-v3-recovery'",s,count=1)
          p.write_text(s)
          p=Path('app/src/main/AndroidManifest.xml'); s=p.read_text()
          if 'android.permission.INTERNET' not in s:
            i=s.find('>')+1; s=s[:i]+'\n    <uses-permission android:name="android.permission.INTERNET" />'+s[i:]
          s=s.replace('android:label="Grow-Tagebuch"','android:label="Grow-Tagebuch v308 Test"')
          p.write_text(s)
          PY
          grep -q "applicationId 'de.harryjane.growtagebuch.v308test'" app/build.gradle
          grep -q 'versionCode 308' app/build.gradle
          grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK exact contents
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Grow-Tagebuch-v308-Beleuchtungsdatenbank-v3-Install.apk
          unzip -t dist/Grow-Tagebuch-v308-Beleuchtungsdatenbank-v3-Install.apk >/dev/null
          unzip -p dist/Grow-Tagebuch-v308-Beleuchtungsdatenbank-v3-Install.apk assets/index.html | grep -q 'v308-lighting-db-v3-recovery'
          unzip -p dist/Grow-Tagebuch-v308-Beleuchtungsdatenbank-v3-Install.apk assets/lighting-db-v3.js > /tmp/apkdb.js
          echo '58a1c2e93bbe9acda24e8d9bfc1a549cd3d52954cf95b37482c069842444090f  /tmp/apkdb.js' | sha256sum -c -
          sha256sum dist/Grow-Tagebuch-v308-Beleuchtungsdatenbank-v3-Install.apk > dist/Grow-Tagebuch-v308-Beleuchtungsdatenbank-v3-Install.apk.sha256

      - name: Publish verified APK to build branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/Grow-Tagebuch-v308-Beleuchtungsdatenbank-v3-Install.apk dist/Grow-Tagebuch-v308-Beleuchtungsdatenbank-v3-Install.apk.sha256
          git commit -m 'Publish verified Grow-Tagebuch v308 APK'
          git push origin HEAD:grow-v308-build

      - uses: actions/upload-artifact@v4
        with:
          name: Grow-Tagebuch-v308-Beleuchtung-v3-Test-APK
          path: dist/Grow-Tagebuch-v308-Beleuchtungsdatenbank-v3-Install.apk
          if-no-files-found: error
          retention-days: 30
