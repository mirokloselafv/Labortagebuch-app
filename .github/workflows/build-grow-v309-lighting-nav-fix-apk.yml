name: Build Grow Tagebuch v309 Lighting Navigation Fix APK

on:
  push:
    branches: [ grow-v309-build ]
    paths:
      - '.github/workflows/build-grow-v309-lighting-nav-fix-apk.yml'
      - '.github/v308recovery/**'
      - '.github/v306/**'
      - '.github/v307/**'
      - '.github/v308/**'
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct verified transformers and databases
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\n\r' < .github/v306/apply_v306.py.gz.b64 | base64 --decode | gzip -dc > /tmp/apply_v306.py
          echo '3dd9305f89fb993a7fda7c8c87ab15638b4d740fd4e01cedc5e4ab76708bd1ac  /tmp/apply_v306.py' | sha256sum -c -

          tr -d '\n\r' < .github/v307/apply_v307.py.gz.b64 | base64 --decode | gzip -dc > /tmp/apply_v307.py
          echo '8459cd5d4dca9113eddbff6ec5412e3ace2418201843d71140bdac64d66d71c3  /tmp/apply_v307.py' | sha256sum -c -

          cat .github/v307/db_chunk_*.b64 | tr -d '\n\r' | base64 --decode | gzip -dc > /tmp/lighting-db-v2.js
          echo '02cb3baa24c7a619a7a2b392dd1809fe007c4412c6f89d14aa8ac21f03229f0b  /tmp/lighting-db-v2.js' | sha256sum -c -

          cat .github/v308/apply_chunk_*.b64 | tr -d '\n\r' | base64 --decode > /tmp/apply_v308.py.gz
          gzip -dc /tmp/apply_v308.py.gz > /tmp/apply_v308.py
          echo 'ed6203214cddde515f644267ee673fbc8c5ffcb6f4733069cf9fd0d76c4e3829  /tmp/apply_v308.py' | sha256sum -c -
          python3 -m py_compile /tmp/apply_v308.py

          cat .github/v308recovery/db_*.b64 | tr -d '\n\r' | base64 --decode > /tmp/lighting-db-v3.xz
          echo 'b1ff4b240d71d3387d84053ce1cf4a4d3a566a3eccd34e2abe020148bf7dc3f3  /tmp/lighting-db-v3.xz' | sha256sum -c -
          xz -dc /tmp/lighting-db-v3.xz > /tmp/lighting-db-v3-original.js
          echo '6695cf157e1d694f84719c4af778632e8604170a858c687dc98106a9a1adf302  /tmp/lighting-db-v3-original.js' | sha256sum -c -
          node --check /tmp/lighting-db-v3-original.js

          cp /tmp/lighting-db-v3-original.js /tmp/lighting-db-v3.js
          cat >> /tmp/lighting-db-v3.js <<'BRIDGE'
          ;window.LIGHTING_DB_V3_META=LIGHTING_DB_V3_META;
          window.LIGHTING_PRODUCTS_V3=LIGHTING_PRODUCTS_V3;
          window.LIGHTING_MAKER_ORDER_V3=LIGHTING_MAKER_ORDER_V3;
          window.normalizeLightingMakerV3=normalizeLightingMakerV3;
          window.mergeLightingProductsV3=mergeLightingProductsV3;
          window.lightingProductsByMakerV3=lightingProductsByMakerV3;
          window.lightingSeriesByMakerV3=lightingSeriesByMakerV3;
          window.lightingImageForV3=lightingImageForV3;
          BRIDGE
          node --check /tmp/lighting-db-v3.js

      - name: Build v309 app assets and apply navigation fix
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/apply_v306.py
          echo '1a4116cf700ba7ce3ad9b4f2dbd4b279b568127140b4b28dfdc64b2f6e47c56b  app/src/main/assets/index.html' | sha256sum -c -

          python3 /tmp/apply_v307.py app/src/main/assets/index.html app/src/main/assets/index.html
          cp /tmp/lighting-db-v2.js app/src/main/assets/lighting-db-v2.js
          echo '9e6e45647ecfac643463b7b15b14c36a6e5da6797e348f91e03645ef36f1fad5  app/src/main/assets/index.html' | sha256sum -c -

          python3 /tmp/apply_v308.py app/src/main/assets/index.html app/src/main/assets/index.html
          cp /tmp/lighting-db-v3.js app/src/main/assets/lighting-db-v3.js
          rm -f app/src/main/assets/lighting-db-v2.js

          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          old="function uniq(rows,key,arr=False)"
          new="function uniq(rows,key,arr=false)"
          if old not in s:
              raise SystemExit('v309 target not found: '+old)
          if s.count(old)!=1:
              raise SystemExit('v309 target count unexpected: '+str(s.count(old)))
          s=s.replace(old,new,1)
          s=s.replace('window.GROW_APP_VERSION="v308-lighting-db-v3-recovery";','window.GROW_APP_VERSION="v309-lighting-navigation-fix";',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Full preflight plus lighting navigation regression checks
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/lighting-db-v3.js
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re, subprocess, collections
          s=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          if not s.rstrip().lower().endswith('</html>'): raise SystemExit('content after </html>')
          if s.lower().count('</html>')!=1: raise SystemExit('unexpected closing html count')
          if 'arr=False' in s: raise SystemExit('v308 runtime bug still present: arr=False')
          if 'function uniq(rows,key,arr=false)' not in s: raise SystemExit('v309 uniq fix missing')
          if 'v309-lighting-navigation-fix' not in s: raise SystemExit('v309 version marker missing')
          class P(HTMLParser):
              def __init__(self): super().__init__(convert_charrefs=False); self.ids=[]
              def handle_starttag(self,t,a): self.ids += [v for k,v in a if k=='id' and v]
              def handle_startendtag(self,t,a): self.handle_starttag(t,a)
          p=P(); p.feed(s)
          dup=[k for k,v in collections.Counter(p.ids).items() if v>1]
          if dup: raise SystemExit('duplicate IDs '+str(dup[:20]))
          js=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script\s*>',s,re.I|re.S)
          for i,x in enumerate(js):
              f=Path('/tmp')/f'v309_inline_{i}.js'; f.write_text(x,encoding='utf-8'); subprocess.run(['node','--check',str(f)],check=True)
          required=['calendarBody','calendarToggle','action2Routinecheck','a2SliderPanel','a2RoutineSensorFill','a2RoutineWeightFeelSlider','h5179RangeTabs','h5179CustomFrom','h5179CustomTo','materialEntries']
          miss=[x for x in required if x not in p.ids]
          if miss: raise SystemExit('required DOM missing: '+', '.join(miss))
          navmarkers=['data-material-maker','data-lighting-series','data-lighting-generation','lightingSeriesViewV3','lightingGenerationViewV3','renderModelsV3','GrowAppBack']
          miss=[x for x in navmarkers if x not in s]
          if miss: raise SystemExit('lighting nav marker missing: '+', '.join(miss))
          print('HTML PREFLIGHT OK:',len(js),'inline scripts /',len(p.ids),'unique IDs')
          print('LIGHTING NAV REGRESSION STATIC CHECK OK: maker -> series -> generation -> model')
          PY

          node - <<'JS'
          function uniq(rows,key,arr=false){const vals=[];(rows||[]).forEach(x=>{const v=x[key];if(arr&&Array.isArray(v))v.forEach(z=>z&&!vals.includes(String(z))&&vals.push(String(z)));else if(v!==undefined&&v!==null&&v!==''&&!vals.includes(String(v)))vals.push(String(v))});return vals.sort()}
          const sample=[{technology:'LED',useCase:['veg','bloom']},{technology:'HPS',useCase:['bloom']}];
          if(uniq(sample,'technology').join(',')!=='HPS,LED') throw Error('default boolean parameter regression');
          if(uniq(sample,'useCase',true).join(',')!=='bloom,veg') throw Error('array filter regression');
          console.log('V309 RUNTIME FILTER REGRESSION OK');
          JS

      - name: Prepare side-by-side Android test package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle'); s=p.read_text()
          s=s.replace("applicationId 'de.harryjane.growtagebuch'", "applicationId 'de.harryjane.growtagebuch.v309test'")
          s=re.sub(r'versionCode\s+\d+','versionCode 309',s,count=1)
          s=re.sub(r"versionName\s+'[^']+'","versionName '309-lighting-navigation-fix'",s,count=1)
          p.write_text(s)
          m=Path('app/src/main/AndroidManifest.xml'); t=m.read_text()
          if 'android.permission.INTERNET' not in t:
              i=t.find('>')+1; t=t[:i]+'\n    <uses-permission android:name="android.permission.INTERNET" />'+t[i:]
          t=t.replace('android:label="Grow-Tagebuch"','android:label="Grow-Tagebuch v309 Test"')
          m.write_text(t)
          PY
          grep -q "applicationId 'de.harryjane.growtagebuch.v309test'" app/build.gradle
          grep -q 'versionCode 309' app/build.gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Verify packaged APK
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk Grow-Tagebuch-v309-Beleuchtung-Navigation-Test.apk
          unzip -t Grow-Tagebuch-v309-Beleuchtung-Navigation-Test.apk >/dev/null
          unzip -p Grow-Tagebuch-v309-Beleuchtung-Navigation-Test.apk assets/index.html > /tmp/apk-index.html
          grep -q 'v309-lighting-navigation-fix' /tmp/apk-index.html
          grep -q 'function uniq(rows,key,arr=false)' /tmp/apk-index.html
          if grep -q 'arr=False' /tmp/apk-index.html; then echo 'old runtime bug found in APK'; exit 1; fi
          grep -q 'data-lighting-series' /tmp/apk-index.html
          grep -q 'data-lighting-generation' /tmp/apk-index.html
          unzip -p Grow-Tagebuch-v309-Beleuchtung-Navigation-Test.apk assets/lighting-db-v3.js > /tmp/apk-db.js
          node --check /tmp/apk-db.js
          grep -q 'LIGHTING_PRODUCTS_V3' /tmp/apk-db.js
          echo 'APK CONTENT VERIFIED'

      - uses: actions/upload-artifact@v4
        with:
          name: Grow-Tagebuch-v309-Beleuchtung-Navigation-Test-APK
          path: Grow-Tagebuch-v309-Beleuchtung-Navigation-Test.apk
          if-no-files-found: error
          retention-days: 30
